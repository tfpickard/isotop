<text x="24.00" y="458.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">Right: a Depth32Float buffer resolves far less than the 0.02 bias until a frame spans some 3e5 world units.</text>
