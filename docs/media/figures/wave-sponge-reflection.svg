<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="system-ui, sans-serif">
<title>The pond's absorbing border</title>
<desc>Left: the damping rate against distance from the border, 0.35 per second plus a quadratic sponge of 6 per second over ten cells. Right: the amplitude reflection coefficient measured with the exact scheme at normal incidence, between 0.46 at 0.35 hertz and 0.18 at 0.8 hertz.</desc>
