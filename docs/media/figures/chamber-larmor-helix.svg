<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, sans-serif">
<title>Larmor radius, charge sign and helix</title>
<desc>Radius against momentum for three fields; opposite curl of positive and negative tracks; a helix in oblique projection.</desc>
<rect width="1200" height="470" fill="#0e1116"/>
<text x="24" y="28" font-size="16" text-anchor="start" fill="#c9d1d9" font-weight="600">A charged track in a uniform field: r = p / (0.3 B)</text>
<text x="24" y="47" font-size="11" text-anchor="start" fill="#8b949e">p in GeV/c, B in tesla, r in metres. Derivation: q v B = m gamma v^2 / r gives p = q B r; with q = e, p[GeV/c] = 0.29979 B[T] r[m].</text>
