<text x="255.00" y="320.10" font-size="12" fill="#c9d1d9" text-anchor="middle" font-weight="600" font-style="normal" font-family="system-ui, sans-serif">35.3 deg</text>
<text x="255.00" y="336.10" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">ISOMETRIC 0.6155 rad, default</text>
<polygon points="468.69,190.00 415.00,243.69 415.00,243.69 468.69,190.00" fill="#58a6ff" fill-opacity="0.55" stroke="#c9d1d9" stroke-width="1.2" stroke-linejoin="round"/>
