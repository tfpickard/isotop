<text x="95.00" y="320.10" font-size="12" fill="#c9d1d9" text-anchor="middle" font-weight="600" font-style="normal" font-family="system-ui, sans-serif">20.1 deg</text>
<text x="95.00" y="336.10" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">LOWEST_PITCH 0.35 rad</text>
