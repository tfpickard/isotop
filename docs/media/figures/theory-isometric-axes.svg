<polygon points="415.00,136.31 468.69,190.00 415.00,243.69 361.31,190.00" fill="#d29922" fill-opacity="0.55" stroke="#c9d1d9" stroke-width="1.2" stroke-linejoin="round"/>
<text x="415.00" y="320.10" font-size="12" fill="#c9d1d9" text-anchor="middle" font-weight="600" font-style="normal" font-family="system-ui, sans-serif">90 deg</text>
<text x="415.00" y="336.10" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">top-down (key t), pi/2</text>
<text x="24.00" y="400.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">faces drawn: top (+z), +x and +y, the three with a positive dot product against</text>
<text x="24.00" y="416.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">the viewer vector (s cos p, c cos p, sin p). At the isometric pitch each axis is</text>
<text x="24.00" y="432.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">one screen unit long; x and y lie at 30 deg below the horizontal.</text>
