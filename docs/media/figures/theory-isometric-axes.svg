<text x="590.00" y="394.00" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">At ISOMETRIC the z curve reads 1.000 and the depth curve 0.707;</text>
<text x="590.00" y="410.00" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">the world x and y axes lie 45 deg to the depth axis and also</text>
<text x="590.00" y="426.00" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">come out at 1.000: SCALE = sqrt(3/2) undoes the foreshortening.</text>
