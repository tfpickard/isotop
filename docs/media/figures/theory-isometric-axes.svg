<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img">
<title>Isotop&#x27;s camera is orthographic</title>
<desc>Unit cubes projected at three pitches, and the on-screen length of the world z axis and of the ground depth axis as a function of pitch.</desc>
<rect width="960" height="470" fill="#0e1116"/>
<text x="24.00" y="30.00" font-size="17" fill="#c9d1d9" text-anchor="start" font-weight="600" font-style="normal" font-family="system-ui, sans-serif">the camera is an axonometric projection: no perspective divide</text>
<text x="24.00" y="50.00" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">Camera::view and Frame::project; screen units are frame pixels at zoom 1</text>
