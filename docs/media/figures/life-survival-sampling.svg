<text x="72" y="430" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal">Shell commands, compiler children and short-lived helpers live far below one second: a once-a-second sampler sees about as many of them as</text>
<text x="72" y="447" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal">the ratio of their life to a second. Fork, exec and exit events (the proc connector, kqueue) see all of them. That is why isotop has `Life`.</text>
</svg>
