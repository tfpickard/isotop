<text x="431" y="341" font-size="11.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">60 samples: Ptolemy's History::recent(until, SERIES)</text>
<text x="72" y="436" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal">Below 250 ms the ring holds under 60 s, so Strata's window is cut short (#127). Away from 1000 ms Ptolemy's 60 samples stop being a minute (#126).</text>
<text x="72" y="453" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal">Counting samples is a unit error: a window is a duration, and `History::window` already selects by `Sample::elapsed`.</text>
