<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="system-ui, sans-serif" role="img">
<title>Round-trip floor against great-circle distance</title>
<desc>Minimum round-trip time in fibre and in vacuum, with cities measured from Amsterdam.</desc>
<rect width="900" height="520" fill="#0e1116"/>
<line x1="90" y1="60" x2="90" y2="420" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90" y1="420" x2="90" y2="424" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="90" y="437" font-size="11" text-anchor="middle" fill="#8b949e">0</text>
<line x1="279.05" y1="60" x2="279.05" y2="420" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="279.05" y1="420" x2="279.05" y2="424" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="279.05" y="437" font-size="11" text-anchor="middle" fill="#8b949e">5000</text>
<line x1="468.11" y1="60" x2="468.11" y2="420" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="468.11" y1="420" x2="468.11" y2="424" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="468.11" y="437" font-size="11" text-anchor="middle" fill="#8b949e">10000</text>
<line x1="657.16" y1="60" x2="657.16" y2="420" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="657.16" y1="420" x2="657.16" y2="424" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="657.16" y="437" font-size="11" text-anchor="middle" fill="#8b949e">15000</text>
<line x1="846.22" y1="60" x2="846.22" y2="420" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="846.22" y1="420" x2="846.22" y2="424" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="846.22" y="437" font-size="11" text-anchor="middle" fill="#8b949e">20000</text>
<line x1="90" y1="420" x2="850" y2="420" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="86" y1="420" x2="90" y2="420" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="424" font-size="11" text-anchor="end" fill="#8b949e">0</text>
<line x1="90" y1="338.18" x2="850" y2="338.18" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="86" y1="338.18" x2="90" y2="338.18" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="342.18" font-size="11" text-anchor="end" fill="#8b949e">50</text>
<line x1="90" y1="256.36" x2="850" y2="256.36" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="86" y1="256.36" x2="90" y2="256.36" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="260.36" font-size="11" text-anchor="end" fill="#8b949e">100</text>
<line x1="90" y1="174.55" x2="850" y2="174.55" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="86" y1="174.55" x2="90" y2="174.55" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="178.55" font-size="11" text-anchor="end" fill="#8b949e">150</text>
<line x1="90" y1="92.73" x2="850" y2="92.73" fill="none" stroke="#222a33" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="86" y1="92.73" x2="90" y2="92.73" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="96.73" font-size="11" text-anchor="end" fill="#8b949e">200</text>
<rect x="90" y="60" width="760" height="360" rx="0" fill="none" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="470" y="456" font-size="12" text-anchor="middle" fill="#c9d1d9">great-circle distance from Amsterdam (km)</text>
<text x="46" y="240" font-size="12" text-anchor="middle" fill="#c9d1d9" transform="rotate(-90 46 240)">minimum round trip (ms)</text>
<text x="90" y="46" font-size="13" text-anchor="start" fill="#c9d1d9" font-weight="600">RTT floor = 2 d n_g / c  (n_g = 1.47 in fibre, 1 in vacuum)</text>
<polyline points="90,420 850,97.45" fill="none" stroke="#ecb25c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="90,420 850,200.58" fill="none" stroke="#48b7c7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
<text x="638.26" y="177.31" font-size="12" text-anchor="start" fill="#ecb25c">fibre: 9.8 ms per 1000 km</text>
<text x="702.54" y="267.15" font-size="12" text-anchor="start" fill="#48b7c7">vacuum: 6.7 ms per 1000 km</text>
<circle cx="311.7" cy="325.91" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="303.7" y="317.91" font-size="10.5" text-anchor="end" fill="#c9d1d9">New York 5860 km, 58 ms</text>
<circle cx="421.74" cy="279.21" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="413.74" y="271.21" font-size="10.5" text-anchor="end" fill="#c9d1d9">San Francisco 8770 km, 86 ms</text>
<circle cx="431.13" cy="275.22" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="423.13" y="267.22" font-size="10.5" text-anchor="end" fill="#c9d1d9">Johannesburg 9020 km, 88 ms</text>
<circle cx="441.23" cy="270.93" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="433.23" y="262.93" font-size="10.5" text-anchor="end" fill="#c9d1d9">Tokyo 9290 km, 91 ms</text>
<circle cx="460.74" cy="262.65" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="452.74" y="254.65" font-size="10.5" text-anchor="end" fill="#c9d1d9">Sao Paulo 9810 km, 96 ms</text>
<circle cx="486.72" cy="251.63" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="478.72" y="243.63" font-size="10.5" text-anchor="end" fill="#c9d1d9">Singapore 10490 km, 103 ms</text>
<circle cx="719.29" cy="152.92" r="4" fill="#ecb25c" stroke="#0e1116" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="711.29" y="144.92" font-size="10.5" text-anchor="end" fill="#c9d1d9">Sydney 16640 km, 163 ms</text>
<text x="90" y="470" font-size="11" text-anchor="start" fill="#8b949e">Half the earth's circumference, 20 015 km, costs at least 196 ms in fibre. Real paths are longer than the great circle, so a measured RTT sits above its floor.</text>
<text x="90" y="488" font-size="11" text-anchor="start" fill="#8b949e">The arcs the globe draws are great circles; their length is the lower bound on the path, not a measurement of it.</text>
</svg>
