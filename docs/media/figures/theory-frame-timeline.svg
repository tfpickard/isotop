<text x="24.00" y="488.00" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">At 10 fps the budget is 100 ms. A frame that overruns skips the wait and starts the next at once;</text>
