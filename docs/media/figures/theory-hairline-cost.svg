<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<title>Cost of a one-pixel stroke drawn as triangles</title>
<desc>Pixels scanned by the CPU triangle loop for a line of width 1.1 drawn as one quad and as pieces of at most 8 pixels, against the length of the line.</desc>
