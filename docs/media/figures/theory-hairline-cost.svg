<text x="930.00" y="142.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">4.0x</text>
<text x="690.00" y="162.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">100</text>
<text x="775.00" y="162.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">10,730</text>
<text x="860.00" y="162.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">1,601</text>
<text x="930.00" y="162.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">6.7x</text>
<text x="690.00" y="182.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">400</text>
<text x="775.00" y="182.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">162,734</text>
<text x="860.00" y="182.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">6,429</text>
<text x="930.00" y="182.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">25.3x</text>
<text x="690.00" y="202.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">1000</text>
<text x="775.00" y="202.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">1,006,780</text>
<text x="860.00" y="202.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">16,111</text>
<text x="930.00" y="202.00" font-size="12" fill="#c9d1d9" text-anchor="end" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">62.5x</text>
<text x="640.00" y="242.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">A piece of 8 px at 45 degrees scans</text>
<text x="640.00" y="258.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">126 pixels for about 9 covered:</text>
<text x="640.00" y="274.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">a constant factor, paid per piece.</text>
<text x="640.00" y="304.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">CPU coverage is by pixel centre (w0, w1, w2 &gt;= 0).</text>
<text x="640.00" y="320.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">At 1.1 px wide, every column of a shallow stroke</text>
<text x="640.00" y="336.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">and every row of a steep one holds a centre;</text>
<text x="640.00" y="352.00" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">a stroke thinner than 1 px could skip some.</text>
<text x="24.00" y="470.00" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">Counts include no frame clamp. Lines (Item::Line, Item::Beam) avoid the issue by stepping max(|dx|, |dy|) + 1 samples,</text>
<text x="24.00" y="486.00" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal" font-style="normal" font-family="system-ui, sans-serif">but their pixels differ between the CPU&#x27;s DDA and a GPU&#x27;s line rule (issue #83), which hairlines sidestep.</text>
</svg>
