[package]
name = "isotop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "A living process city and orbital observatory inside your terminal"
license = "MPL-2.0"

[dependencies]
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flate2 = "1.1"
libc = "0.2"
maxminddb = "0.32"
png = "0.18"
pollster = "1"
wgpu = "30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "warn"
too_many_arguments = "warn"
