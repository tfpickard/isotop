name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon (arm64); macos-14 is marked deprecated in
        # GitHub's runner-images.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Both runner images ship rustup; installing through it avoids a third-party action.
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: Render coop and orbit headless
        run: |
          for view in coop orbit; do
            ./target/release/isotop --demo --view "$view" --renderer cpu \
              --width 960 --time 12 --output "$view-${{ runner.os }}.png"
          done

      # Live mode reads the real operating system, so these catch what the demo cannot: layout
      # and permission errors in the collector. Each takes two samples before drawing.
      - name: Render the live machine headless
        run: |
          ./target/release/isotop --view orbit --width 960 --output "live-${{ runner.os }}.png"
          ./target/release/isotop --view cells --width 960 --output "live-cells-${{ runner.os }}.png"

      # Root can read every process, which takes a different path through the collector than an
      # ordinary user. GitHub's macOS runners have passwordless sudo, but this is not guaranteed
      # forever, and the step proves nothing about the user path, so it must not fail the job.
      - name: Render the live machine headless as root
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo ./target/release/isotop --view orbit --width 960 --output live-root-macOS.png
          sudo chown "$(id -u)" live-root-macOS.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ runner.os }}
          path: "*-${{ runner.os }}.png"

      - name: Smoke test in a pseudo-terminal
        run: python3 scripts/smoke_terminal.py

      # Metal parity evidence; the runner may not expose a GPU, so never fail on it.
      - name: Render coop on the GPU
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./target/release/isotop --demo --view coop --renderer gpu \
            --width 960 --time 12 --output coop-gpu-${{ runner.os }}.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        continue-on-error: true
        with:
          name: renders-gpu-${{ runner.os }}
          path: coop-gpu-${{ runner.os }}.png
