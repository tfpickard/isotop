name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon (arm64); macos-14 is marked deprecated in
        # GitHub's runner-images.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # Warm runs take about 2 minutes; this leaves room for a cold cache and more renders.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Both runner images ship rustup. With no arguments, `rustup toolchain install` installs
      # what rust-toolchain.toml pins, so a new stable release cannot change CI unannounced.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Type-checks the macOS-only code without the Apple SDK, so a break shows up before the
      # slower macOS job finishes.
      - name: Clippy for macOS from Linux
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-apple-darwin
          cargo clippy --locked --target aarch64-apple-darwin --all-targets -- -D warnings
      - run: cargo test --locked
      # A crash in native code (a CoreFoundation trap, a bad FFI call) kills the test binary
      # without a Rust message. Re-run it one test at a time under lldb so the log names the
      # test and shows the native backtrace.
      - name: Backtrace a crashed macOS test run
        if: failure() && runner.os == 'macOS'
        run: |
          binary=$(cargo test --locked --no-run --message-format=json 2>/dev/null \
            | python3 -c 'import json,sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("profile", {}).get("test") and m.get("executable"):
                  print(m["executable"])' | head -n 1)
          lldb --batch -o run -k "thread backtrace all" -k quit -- "$binary" --test-threads=1
      - run: cargo build --locked --release

      # Every view the registry offers on this platform, as `--list-views` prints them.
      - name: Render every view headless
        run: |
          views=$(./target/release/isotop --list-views)
          test -n "$views"
          for view in $views; do
            ./target/release/isotop --demo --view "$view" --renderer cpu \
              --width 960 --time 12 --output "$view-${{ runner.os }}.png"
          done

      # Live mode reads the real operating system, so these catch what the demo cannot: layout
      # and permission errors in the collector. Each takes two samples before drawing.
      - name: Render the live machine headless
        run: |
          ./target/release/isotop --view orbit --width 960 --output "live-${{ runner.os }}.png"
          ./target/release/isotop --view cells --width 960 --output "live-cells-${{ runner.os }}.png"

      # Root can read every process, which takes a different path through the collector than an
      # ordinary user. GitHub's macOS runners have passwordless sudo, but this is not guaranteed
      # forever, and the step proves nothing about the user path, so it must not fail the job.
      - name: Render the live machine headless as root
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo ./target/release/isotop --view orbit --width 960 --output live-root-macOS.png
          sudo chown "$(id -u)" live-root-macOS.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: renders-${{ runner.os }}
          path: "*-${{ runner.os }}.png"

      - name: Smoke test in a pseudo-terminal
        run: python3 scripts/smoke_terminal.py

      # The code report (docs/METRICS.md and the README block) must match the tree. tokei is a
      # tool, not a dependency. v14.0.0 publishes no prebuilt binaries (the last release with
      # any is 12.1.2, whose counts can differ), so build the pinned version once and cache it;
      # --locked uses tokei's own lockfile. Output is not platform-specific, so Linux alone checks.
      - name: Code report self-test
        if: runner.os == 'Linux'
        run: python3 scripts/code_report.py --self-test
      - name: Cache tokei
        id: tokei
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tokei
          key: tokei-14.0.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install tokei
        if: runner.os == 'Linux' && steps.tokei.outputs.cache-hit != 'true'
        run: cargo install tokei --locked --version 14.0.0
      - name: Code report is current
        if: runner.os == 'Linux'
        run: python3 scripts/code_report.py --check

      # Metal parity evidence; the runner may not expose a GPU, so never fail on it.
      - name: Render coop on the GPU
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./target/release/isotop --demo --view coop --renderer gpu \
            --width 960 --time 12 --output coop-gpu-${{ runner.os }}.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        continue-on-error: true
        with:
          name: renders-gpu-${{ runner.os }}
          path: coop-gpu-${{ runner.os }}.png

      # Every view, CPU against GPU, with the tolerance in docs/VIEW_CONVENTIONS.md. The script
      # exits 1 on a miss; the step still uploads what it measured and never blocks the job.
      - name: CPU/GPU parity for every view
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          mkdir parity
          : > parity.txt
          status=0
          for view in $(./target/release/isotop --list-views); do
            for renderer in cpu gpu; do
              ./target/release/isotop --demo --view "$view" --renderer "$renderer" \
                --width 960 --time 12 --output "parity/$view-$renderer.png" || status=1
            done
            line=$(python3 scripts/compare_png.py "parity/$view-cpu.png" "parity/$view-gpu.png") \
              || status=1
            echo "$view: $line" | tee -a parity.txt
          done
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        with:
          name: parity-${{ runner.os }}
          path: |
            parity.txt
            parity/*.png
          if-no-files-found: ignore

      - name: Self-test the PNG comparison script
        run: python3 scripts/compare_png.py --self-test

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
      # SHA-256 of cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz, from the
      # release's .sha256 asset. Update both together.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # cargo-deny is a tool, not a dependency, so install the prebuilt release binary.
      - name: Install cargo-deny
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --strip-components=1 --wildcards '*/cargo-deny'
      - run: ./cargo-deny --locked check advisories bans licenses sources
